apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-app
  namespace: devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-ordering-app
  template:
    metadata:
      labels:
        app: food-ordering-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: food-ordering-app
          image: 767397774715.dkr.ecr.us-east-1.amazonaws.com/devsecops-nodejs:2.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/menu
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/menu
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
